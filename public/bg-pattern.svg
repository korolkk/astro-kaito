<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8e0f0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d8e8f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f0e8;stop-opacity:1" />
    </linearGradient>
    <pattern id="wavy" x="0" y="0" width="120" height="80" patternUnits="userSpaceOnUse">
      <path d="M0 40 Q30 10 60 40 T120 40" fill="none" stroke="rgba(100,80,140,0.15)" stroke-width="2"/>
      <path d="M0 50 Q30 20 60 50 T120 50" fill="none" stroke="rgba(80,120,160,0.12)" stroke-width="1.5"/>
      <path d="M0 30 Q30 0 60 30 T120 30" fill="none" stroke="rgba(80,140,120,0.10)" stroke-width="1.5"/>
    </pattern>
    <pattern id="grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="none" stroke="rgba(120,120,160,0.08)" stroke-width="0.5"/>
    </pattern>
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:rgba(180,160,220,0.3);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(180,160,220,0);stop-opacity:1" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" style="stop-color:rgba(160,200,220,0.25);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(160,200,220,0);stop-opacity:1" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <rect width="800" height="600" fill="url(#wavy)"/>
  <rect width="800" height="600" fill="url(#glow1)"/>
  <rect width="800" height="600" fill="url(#glow2)"/>
</svg>
