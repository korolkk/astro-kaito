name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  # ==================== 部署到阿里云服务器 ====================
  deploy-aliyun:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Aliyun secrets configured
        id: check
        env:
          HOST: ${{ secrets.ALIYUN_HOST }}
        run: |
          if [ -n "$HOST" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.configured == 'true'
        run: npm run build
        env:
          BASE_URL: /

      - name: Trigger Alibaba Cloud deploy
        if: steps.check.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.ALIYUN_HOST }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          echo "📡 通知服务器拉取并部署..."
          RESP=$(curl -s -w "\n%{http_code}" -X POST "https://$HOST/api/deploy" \
            -H 'Content-Type: application/json' \
            -d "{\"secret\":\"$DEPLOY_SECRET\"}")
          HTTP_CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | sed '$d')
          echo "HTTP $HTTP_CODE: $BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ 触发部署失败"
            exit 1
          fi
          echo "✅ 服务器已收到部署指令，正在后台执行"

  # ==================== 部署到 GitHub Pages ====================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE_URL: /astro-kaito
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
